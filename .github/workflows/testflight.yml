name: TestFlight

# Builds, signs and uploads GoldenHour to App Store Connect (TestFlight) from a GitHub macOS
# runner, so no Mac is needed. Start it from the Actions tab: "TestFlight" › "Run workflow".
#
# One-time setup (see docs/GUIDE_SANS_MAC.md):
#   Repository variables (Settings › Secrets and variables › Actions › Variables):
#     APPLE_TEAM_ID   10-character team identifier
#     APP_BUNDLE_ID   e.g. com.yourname.goldenhour (registered, with an app record in App Store Connect)
#   Repository secrets (same page › Secrets):
#     ASC_KEY_ID      App Store Connect API key ID
#     ASC_ISSUER_ID   App Store Connect issuer ID
#     ASC_KEY_P8      full text of the AuthKey_XXXX.p8 file
#
# Signing uses Xcode's automatic signing with the API key: certificates and the App Store
# provisioning profile are created and managed by Apple (cloud signing); nothing to install.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=0
          for name in TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing setting: $name (see docs/GUIDE_SANS_MAC.md)"; missing=1; fi
          done
          if ! printf '%s' "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then echo "::error::APPLE_TEAM_ID must be 10 letters/digits"; missing=1; fi
          if ! printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then echo "::error::ASC_KEY_P8 must contain the whole .p8 file, including the BEGIN/END lines"; missing=1; fi
          exit $missing

      - name: Install API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project GoldenHour.xcodeproj \
            -scheme GoldenHour \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GoldenHour.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|warning: .*GoldenHour|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Sign and upload (cloud signing)
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GoldenHour.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)"
          echo "Build ${{ github.run_number }} uploaded. It appears in App Store Connect › TestFlight after Apple's processing (10–30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
