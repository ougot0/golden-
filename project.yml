# XcodeGen specification (https://github.com/yonaskolb/XcodeGen).
# The generated GoldenHour.xcodeproj is committed; regenerate it after adding or removing files:
#   xcodegen generate
name: GoldenHour
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple developer team identifier here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GoldenHourKit:
    path: Packages/GoldenHourKit
targets:
  GoldenHour:
    type: application
    platform: iOS
    sources:
      - path: GoldenHour
    dependencies:
      - package: GoldenHourKit
        product: SolarEngine
      - package: GoldenHourKit
        product: GoldenHourCore
    info:
      path: GoldenHour/Info.plist
      properties:
        CFBundleDisplayName: GoldenHour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "GoldenHour utilise votre position, uniquement sur l'appareil, pour calculer les heures du soleil là où vous êtes et orienter la boussole solaire."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goldenhour
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  GoldenHourTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoldenHourTests
    dependencies:
      - target: GoldenHour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goldenhour.tests
        GENERATE_INFOPLIST_FILE: YES
  GoldenHourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoldenHourUITests
    dependencies:
      - target: GoldenHour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goldenhour.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GoldenHour
schemes:
  GoldenHour:
    build:
      targets:
        GoldenHour: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - GoldenHour
      targets:
        - GoldenHourTests
        - GoldenHourUITests
        - package: GoldenHourKit/SolarEngineTests
        - package: GoldenHourKit/GoldenHourCoreTests
    archive:
      config: Release
